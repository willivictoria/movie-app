{% extends "base.html" %}
{% block content %}

<h2 class="text-3xl font-bold mb-6 text-center">Crear nueva serie</h2>

<!-- Contenedor que centra todo -->
<div class="flex justify-center">
    <form method="post" class="bg-white p-6 shadow rounded-lg w-1/2">
    
        <label class="block mb-3">
            <span>Título</span>
            <input type="text" name="titulo" required class="w-full p-2 border rounded">
        </label>

        <label class="block mb-3">
            <span>Descripción</span>
            <textarea name="descripcion" class="w-full p-2 border rounded"></textarea>
        </label>

        <label class="block mb-3">
            <span>Año lanzamiento</span>
            <input type="number" name="anio_lanzamiento" required class="w-full p-2 border rounded">
        </label>

        <label class="block mb-3">
            <span>Género</span>
            <input type="text" name="genero" required class="w-full p-2 border rounded">
        </label>

        <button class="mt-4 px-6 py-2 bg-green-600 text-white rounded hover:bg-green-700">
            Guardar
        </button>

    </form>
</div>

{% endblock %}
