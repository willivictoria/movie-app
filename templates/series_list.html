{% extends "base.html" %}
{% block content %}

<h2 class="text-3xl font-bold mb-6 text-center">Listado de Series</h2>

<!-- Contenedor centrado -->
<table class="bg-white shadow rounded-lg overflow-hidden w-3/4 mx-auto text-center">
    <thead class="bg-indigo-600 text-white">
        <tr>
            <th class="py-3 px-4">ID</th>
            <th class="py-3 px-4">Título</th>
            <th class="py-3 px-4">Año</th>
            <th class="py-3 px-4">Género</th>
            <th class="py-3 px-4">Acciones</th>
        </tr>
    </thead>

    <tbody>
        {% for s in series %}
        <tr class="border-b hover:bg-gray-50">
            <td class="py-3 px-4">{{ s.serie_id }}</td>
            <td class="py-3 px-4">{{ s.titulo }}</td>
            <td class="py-3 px-4">{{ s.anio_lanzamiento }}</td>
            <td class="py-3 px-4">{{ s.genero }}</td>

            <td class="py-3 px-4">
                <div class="flex justify-center space-x-4">
                    <a href="/series/update/{{ s.serie_id }}" class="text-blue-600 hover:underline">Editar</a>
                    <a href="/series/delete/{{ s.serie_id }}" class="text-red-600 hover:underline">Eliminar</a>
                </div>
            </td>

        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
